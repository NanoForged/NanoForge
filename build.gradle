plugins {
    id 'java'
    id 'eclipse'
    id 'application'
    id 'maven-publish'
}

group = 'io.github.nanoforged'
version = '0.1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven { url 'https://maven.aliyun.com/repository/public/' }
    maven { url 'https://maven.aliyun.com/repository/central' }
    maven {
        name "LegacyFabric"
        url "https://repo.legacyfabric.net/legacyfabric"
    }
    maven {
        url "https://jitpack.io"
    }
    maven {
        url = uri("https://nexus.gtnewhorizons.com/repository/releases/")
    }
}
project.ext.lwjglVersion = "2.9.4+legacyfabric.3"



dependencies {

    //LaunchWrapper but FOSS
    implementation('com.gtnewhorizons.retrofuturabootstrap:RetroFuturaBootstrap:1.0.12')

    //forked by FabricMC
    implementation "net.fabricmc:sponge-mixin:0.16.3+mixin.0.8.7"
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))

    // EventBus
    implementation('net.neoforged:bus:8.0.5')

    implementation("com.google.auto.service:auto-service:1.1.1")
    runtimeOnly("com.google.auto.service:auto-service-annotations:1.1.1")

    // coremod.toml 元数据解析（与 NeoForge 同款）
    implementation 'com.electronwill.night-config:core:3.8.3'
    implementation 'com.electronwill.night-config:toml:3.8.3'

    // 类级 bin patch 的 diff/apply（R2 Patch 工作流，纯 Java 无传递依赖）
    implementation 'org.badiff:badiff:1.2.1'

    // 测试
    testImplementation platform('org.junit:junit-bom:5.13.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'


    //slf4j is back!
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'org.slf4j:log4j-over-slf4j:2.0.17'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.25.2'
    implementation 'org.apache.logging.log4j:log4j-core:2.25.2'

    /*
    somehow it doesn't work , maybe wrong version
    //Janino
    implementation 'org.codehaus.janino:janino:3.1.12'
    implementation 'org.codehaus.janino:commons-compiler:3.1.12'
    implementation 'org.codehaus.janino:commons-compiler-jdk:3.1.12'
    */

    //Janino
    implementation 'org.codehaus.janino:janino:2.7.8'
    implementation 'org.codehaus.janino:commons-compiler:2.7.8'
    implementation 'org.codehaus.janino:commons-compiler-jdk:2.7.8'


    //idk dependencies
    /* need patch
    implementation 'com.thoughtworks.xstream:xstream:1.4.21'
    */
    implementation 'com.thoughtworks.xstream:xstream:1.4.16'
    implementation "com.github.usefulness:webp-imageio:0.10.2"
    implementation 'org.json:json:20250517'
    implementation 'org.glassfish.jaxb:txw2:4.0.6'
    implementation 'javax.xml.bind:jaxb-api:2.4.0-b180830.0359'
    implementation('net.java.jinput:jinput:2.0.10')
    implementation 'com.googlecode.soundlibs:jorbis:0.0.17.4'


    //lwjgl2 Legacy Fabric fork
    implementation "org.lwjgl.lwjgl:lwjgl:$lwjglVersion"
    //implementation "org.lwjgl.lwjgl:lwjgl_util_applet:$lwjglVersion"
    implementation "org.lwjgl.lwjgl:lwjgl_util:$lwjglVersion"
    //implementation "org.lwjgl.lwjgl:parent:$lwjglVersion"
    implementation "org.lwjgl.lwjgl:lwjgl-platform:$lwjglVersion"
    implementation "org.lwjgl.lwjgl:lwjgl-platform:$lwjglVersion"

    //game jar
    runtimeOnly fileTree(dir: 'lib/gameJar', include: ['*.jar'])


    //it just work
    //implementation fileTree(dir: 'lib', include: ['*.jar'])
}

test {
    useJUnitPlatform()
}

// mixin 子系统要求 mixin 类经 LaunchClassLoader 加载（包不得被 RFB 系统类加载器占有）。
// RFB 的 Launch 会把 tweaker 所在包（io.github.nanoforged）整体注册为
// LaunchClassLoader 排除项，故 mixin 类置于独立根包 nanoforge.mixin 下，
// 且与配置单独打包到 build/nanoforge/runtime/（不在启动脚本 -classpath glob 内），
// 由 NanoForgeBootstrap 显式 addURL 进 LaunchClassLoader。
jar {
    exclude 'nanoforge/mixin/**', 'nanoforge.init.mixins.json'
}

// 供 coremod 项目（如 SSOptimizer）编译期 compileOnly 依赖：
// ./gradlew publishToMavenLocal → io.github.nanoforged:NanoForge:0.1.0-SNAPSHOT
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

tasks.register('mixinJar', Jar) {
    group = 'nanoforge'
    description = '打包 mixin 类与 init 配置到 build/nanoforge/runtime/NanoForge-mixins.jar'
    archiveFileName = 'NanoForge-mixins.jar'
    destinationDirectory = layout.buildDirectory.dir('nanoforge/runtime')
    from(sourceSets.main.output) {
        include 'nanoforge/mixin/**', 'nanoforge/save/**', 'nanoforge.init.mixins.json'
    }
}

tasks.register('copyAssets', Copy) {
    from 'assets'
    into 'run/'

    inputs.dir 'assets'
    outputs.dir 'run/'
}

tasks.register('extractNativeLib', Copy) {
    from zipTree(configurations.runtimeClasspath.find {
        it.name.contains("lwjgl-platform") && it.name.contains(lwjglVersion)
    })
    into "lib/native"
    include "**/*.dll", "**/*.so", "**/*.dylib"
}
copyAssets.dependsOn extractNativeLib

// R3 natives 装配：从官方 natives jar（lwjgl 2.9.3 / jinput 2.0.7，随游戏发布，
// 来源目录默认取 SSOptimizer named-game-jars 构建产物）按 OS 提取到 lib/native/{linux,macos,windows}
// 源 jar 不入 Git；缺失即报错。
tasks.register('extractGameNatives') {
    group = 'nanoforge'
    description = '从官方 natives jar 按 OS 提取游戏 natives 到 lib/native/'

    def namedJars = providers.gradleProperty('sourcesector.namedJars')
            .getOrElse('../SSOptimizer/build/named-game-jars/windows')
    def osMap = [linux: 'linux', macos: 'osx', windows: 'windows']

    outputs.dir 'lib/native'
    outputs.upToDateWhen { false }

    doLast {
        osMap.each { outName, jarSuffix ->
            ['lwjgl-platform-2.9.3', 'jinput-platform-2.0.7'].each { base ->
                def src = file("$namedJars/${base}-natives-${jarSuffix}.jar")
                if (!src.isFile()) {
                    throw new GradleException("natives 源 jar 不存在: $src（可用 -Psourcesector.namedJars= 覆盖目录）")
                }
                copy {
                    from zipTree(src)
                    into "lib/native/$outName"
                    include '**/*.dll', '**/*.so', '**/*.dylib', '**/*.jnilib'
                }
            }
        }
    }
}

// R3 remap mapping 表打包：SourceSector 全量 tiny → gzip，供 deployToGame 部署。
// 独立任务（不挂进 build，CI/他机无此本地资产）；源缺失显式报错。
tasks.register('packFullMapping') {
    group = 'nanoforge'
    description = 'gzip SourceSector 全量 mapping 表到 build/nanoforge/game-full.tiny.gz'

    def fullTiny = providers.gradleProperty('sourcesector.fullTiny')
            .getOrElse('../SourceSector/mapping/build/generated/mappings/windows/ssoptimizer-windows-full.tiny')
    def output = layout.buildDirectory.file('nanoforge/game-full.tiny.gz')

    outputs.file(output)
    outputs.upToDateWhen { false }

    doLast {
        def src = file(fullTiny)
        if (!src.isFile()) {
            throw new GradleException("SourceSector 全量 mapping 不存在: $src（可用 -Psourcesector.fullTiny= 覆盖路径）")
        }
        def target = output.get().asFile
        target.parentFile.mkdirs()
        src.withInputStream { raw ->
            target.withOutputStream { fileOut ->
                new java.util.zip.GZIPOutputStream(fileOut).withStream { gz -> gz << raw }
            }
        }
        logger.lifecycle("已打包全量 mapping: $src -> $target")
    }
}

// 存档兼容表打包：SourceSector 合成的 linux-obf → named 跨平台兼容表 → gzip，供 deployToGame 部署。
// 由 :mapping:generateLinuxSaveCompatMapping 产出；源缺失显式报错。
tasks.register('packSaveCompatMapping') {
    group = 'nanoforge'
    description = 'gzip SourceSector 存档兼容表到 build/nanoforge/game-linux-save-compat.tiny.gz'

    def compatTiny = providers.gradleProperty('sourcesector.saveCompatTiny')
            .getOrElse('../SourceSector/mapping/build/generated/mappings/linux-save-compat/0.98a-rc8-linux-save-compat.tiny')
    def output = layout.buildDirectory.file('nanoforge/game-linux-save-compat.tiny.gz')

    outputs.file(output)
    outputs.upToDateWhen { false }

    doLast {
        def src = file(compatTiny)
        if (!src.isFile()) {
            throw new GradleException("SourceSector 存档兼容表不存在: $src（可用 -Psourcesector.saveCompatTiny= 覆盖路径）")
        }
        def target = output.get().asFile
        target.parentFile.mkdirs()
        src.withInputStream { raw ->
            target.withOutputStream { fileOut ->
                new java.util.zip.GZIPOutputStream(fileOut).withStream { gz -> gz << raw }
            }
        }
        logger.lifecycle("已打包存档兼容表: $src -> $target")
    }
}

// R3 部署：NanoForge jar + 运行时依赖 + mapping 表 → 游戏目录 mods/nanoforge/
// 用法：./gradlew deployToGame -Pgame.dir=/mnt/store/Games/Starsector098-linux
tasks.register('deployToGame', Copy) {
    group = 'nanoforge'
    description = '部署 NanoForge jar、运行时依赖与 mapping 表到游戏目录 mods/nanoforge/'

    def gameDir = providers.gradleProperty('game.dir')

    dependsOn jar, packFullMapping, packSaveCompatMapping, unsealLwjgl, mixinJar
    into { gameDir.map { "$it/mods/nanoforge" }.get() }
    from jar
    from(layout.buildDirectory.dir('nanoforge'))
    from({
        configurations.runtimeClasspath.filter { dep ->
            // 游戏目录已提供同名库（lwjgl/jinput/janino/xstream/json/jaxb/txw2/webp 等），
            // 只部署 NanoForge 独有的运行时设施，避免与游戏 classpath 重复
            def n = dep.name.toLowerCase()
            ['retrofuturabootstrap', 'jopt-simple', 'sponge-mixin', 'mixinextras', 'bus-',
             'core-3.8', 'toml-3.8', 'badiff', 'slf4j', 'log4j-', 'asm'].any { n.contains(it) }
        }
    })

    doFirst {
        if (!gameDir.isPresent()) {
            throw new GradleException('缺少参数：需 -Pgame.dir=<游戏根目录>')
        }
    }
}

// RFB 系统类加载器对 sealed jar 的密封校验与 lwjgl.jar（manifest 主属性 Sealed: true）
// 不兼容（同包两类源判定为 Sealing violation）。部署时生成去密封副本
// build/nanoforge/lwjgl-unsealed.jar，启动脚本以它替换 classpath 中的 lwjgl.jar；
// 游戏目录原始 lwjgl.jar 不改动。
tasks.register('unsealLwjgl') {
    group = 'nanoforge'
    description = '生成去密封的 lwjgl.jar 副本（RFB 密封校验兼容）'

    def gameDir = providers.gradleProperty('game.dir')
    def output = layout.buildDirectory.file('nanoforge/lwjgl-unsealed.jar')

    outputs.file(output)
    outputs.upToDateWhen { false }

    doLast {
        if (!gameDir.isPresent()) {
            throw new GradleException('缺少参数：需 -Pgame.dir=<游戏根目录>')
        }
        def src = gameDir.map { file("$it/lwjgl.jar") }.get()
        if (!src.isFile()) {
            throw new GradleException("游戏目录 lwjgl.jar 不存在: $src")
        }
        def target = output.get().asFile
        target.parentFile.mkdirs()
        // 逐条目复制，仅重写 manifest（移除主属性 Sealed）
        def srcJar = new java.util.jar.JarFile(src)
        try {
            def manifest = srcJar.manifest
            if (manifest == null) {
                throw new GradleException("lwjgl.jar 缺少 manifest: $src")
            }
            manifest.mainAttributes.remove(new java.util.jar.Attributes.Name('Sealed'))
            def out = new java.util.jar.JarOutputStream(new FileOutputStream(target), manifest)
            try {
                srcJar.entries().asIterator().each { entry ->
                    if (entry.name.equalsIgnoreCase('META-INF/MANIFEST.MF')) {
                        return // manifest 已由构造器写出
                    }
                    out.putNextEntry(new java.util.jar.JarEntry(entry.name))
                    if (!entry.directory) {
                        srcJar.getInputStream(entry).withStream { it.transferTo(out) }
                    }
                    out.closeEntry()
                }
            } finally {
                out.close()
            }
        } finally {
            srcJar.close()
        }
        logger.lifecycle("已生成去密封 lwjgl 副本: $target")
    }
}

// R2 Patch 工作流：对比原 named jar 与修改后编译产物，生成 NFBP bin patch
// 用法：./gradlew generatePatches -Ppatch.original=<原named.jar> -Ppatch.patched=<修改后class目录> -Ppatch.output=<输出目录>
tasks.register('generatePatches', JavaExec) {
    group = 'nanoforge'
    description = '对比原 named jar 与 patched class 目录，生成类级 bin patch（NFBP）'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.github.nanoforged.core.patch.PatchGenCli'

    def original = providers.gradleProperty('patch.original')
    def patched = providers.gradleProperty('patch.patched')
    def output = providers.gradleProperty('patch.output')

    doFirst {
        if (!original.isPresent() || !patched.isPresent() || !output.isPresent()) {
            throw new GradleException('缺少参数：需 -Ppatch.original= -Ppatch.patched= -Ppatch.output=')
        }
    }
    args(original.getOrElse(''), patched.getOrElse(''), output.getOrElse(''))
}
